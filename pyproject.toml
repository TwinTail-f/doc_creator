[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodoc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "requests>=2.31",
    "urllib3>=2.0",
    "rich>=13.0",
    "jinja2>=3.1",
    "PyYAML>=6.0",
    "conan>=2.29.1,<3.0",
    "beautifulsoup4>=4.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.scripts]
autodoc = "autodoc.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autodoc*"]

[tool.pytest.ini_options]
testpaths = ["autodoc/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
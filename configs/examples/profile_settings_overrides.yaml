# Пример файла переопределений настроек Conan-профилей.
# Скопируйте в configs/profile_settings_overrides.yaml и заполните.
#
# Костыль для профилей, использующих Jinja-шаблоны с os.getenv().
# Если профиль требует env-переменные (например KOS_SDK_VER для
# compiler.toolchain_config_id), но они не заданы в окружении,
# опишите здесь нужные -s настройки явно.

overrides:
  # Профили KOS KISG x86_64 — toolchain v3.1.0.130
  - profiles:
      - "kos-kisg-x86_64-pc-clang.jinja"
      - "mobile-kos-kisg-x86_64-pc.jinja"
    settings:
      compiler.toolchain_config_id: "kos-kisg-3.1.0.130"

  # Профили KOS x86_64 (без kisg) — toolchain v2.1.2.31
  - profiles:
      - "kos-x86_64-pc-clang.jinja"
      - "mobile-kos-x86_64-pc.jinja"
    settings:
      compiler.toolchain_config_id: "kos-x86_64-2.1.2.31"

  # Профили aarch64 — другой toolchain и другой параметр settings
  - profiles:
      - "mobile-kos-aarch64.jinja"
    settings:
      compiler.toolchain_config_id: "kos-aarch64-2.1.0.49"
      compiler.version: "12"

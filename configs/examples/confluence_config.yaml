# Пример конфигурации Confluence. Скопируйте в configs/confluence_config.yaml и заполните.

url: "https://confluence.company.com"
token: "YOUR_ATLASSIAN_API_TOKEN"

space: "PLATFORM"
verify_ssl: false

# Настройки публикации, сгруппированные по типу стратегии. Каждую секцию можно не
# указывать вовсе, если родительская страница всегда передаётся через CLI-флаги
# (--root-page-name/--root-page-id, --passports-root-parent-name/-id). Но если секция
# указана — обязательно root_parent_name и/или root_parent_id (иначе конфиг не
# провалидируется).
strategies:
  release:
    # Укажите root_parent_name ИЛИ root_parent_id. Если заданы оба — приоритет у name.
    root_parent_name: "Документация к релизу Платформы 2.2.0"
    # root_parent_id: "123456789"   # запасной вариант

    page_title: "Документация к релизу Платформы 2.2.0"

  # profile_centric:  # для `publish profile`; раскомментируйте при необходимости
  #   root_parent_name: "Документация от профилей Платформы 2.2.0"
  #   root_parent_id: "123456789"   # запасной вариант
  #   page_title: "Документация от профилей Платформы 2.2.0"

  passports:
    root_parent_name: "Паспорта компонентов"
    # root_parent_id: "987654321"   # запасной вариант

confluence_request_timeout: 30

# Настройки пакетной публикации паспортов (значения ниже совпадают со
# значениями по умолчанию в схеме и README — раскомментируйте и поменяйте,
# только если реально нужно отклониться от дефолта, например при перегрузках
# сервера Confluence)
# publish_batch_size: 10
# publish_batch_delay_seconds: 0.0

# Поведение при обнаружении страницы с совпадающим заголовком под другим родителем:
# 'error' — прервать операцию с исключением (по умолчанию);
# 'move' — перенести существующую страницу под ожидаемого родителя, сохранив содержимое.
title_conflict_policy: "error"

target_release_version: "Platform 2.2"

# Пример конфигурации Confluence. Скопируйте в configs/confluence_config.yaml и заполните.

url: "https://confluence.company.com"
token: "YOUR_ATLASSIAN_API_TOKEN"

space: "PLATFORM"
verify_ssl: false

# Настройки публикации, сгруппированные по типу стратегии. `publish all` берёт все
# параметры из этого файла (флагов у команды нет): для каждого выбранного в publish_all.targets
# типа (по умолчанию — всех) обязательна секция с root_parent_name и/или root_parent_id.
# Исключение — profile_centric: её страница публикуется дочерней к странице релиза.
# page_title в секциях release, profile_centric, kit_pinned, kit_latest не может быть пустым.
# Остальные команды (`publish release`, `publish profile` и т.д.) могут получать родительскую
# страницу через CLI-флаги; для них секцию можно не указывать вовсе. Если секция указана —
# обязательно root_parent_name и/или root_parent_id (иначе конфиг не провалидируется).
strategies:
  release:
    # Укажите root_parent_name ИЛИ root_parent_id. Если заданы оба — приоритет у name.
    root_parent_name: "Документация к релизу Платформы 2.2.0"
    # root_parent_id: "123456789"   # запасной вариант

    page_title: "Документация к релизу Платформы 2.2.0"

  # Для `publish all` секция не нужна: профильная страница публикуется дочерней к странице
  # релиза, из секции берётся только page_title. Для `publish profile` — раскомментируйте.
  # profile_centric:
  #   root_parent_name: "Документация от профилей Платформы 2.2.0"
  #   root_parent_id: "123456789"   # запасной вариант
  #   page_title: "Документация от профилей Платформы 2.2.0"

  passports:
    root_parent_name: "Паспорта компонентов"
    # root_parent_id: "987654321"   # запасной вариант

  kit_pinned:
    root_parent_name: "Комплект для встраивания компонентов platform"
    # root_parent_id: "123456789"   # запасной вариант
    page_title: "Комплект для встраивания компонентов platform"

  kit_latest:
    root_parent_name: "Встраивание последних версий компонентов платформы"
    # root_parent_id: "123456789"   # запасной вариант
    page_title: "Встраивание последних версий компонентов платформы"

# Какие типы публикации выполняет `publish all` (по умолчанию — все пять). Порядок в списке
# не важен: публикация идёт в фиксированном порядке. profile_centric требует в списке 'release'.
# Для каждого выбранного типа, кроме profile_centric, должна быть заполнена секция выше.
# publish_all:
#   targets: [passports, release, profile_centric, kit_pinned, kit_latest]

confluence_request_timeout: 30

# Настройки пакетной публикации паспортов (значения ниже совпадают со
# значениями по умолчанию в схеме и README — раскомментируйте и поменяйте,
# только если реально нужно отклониться от дефолта, например при перегрузках
# сервера Confluence)
# publish_batch_size: 10
# publish_batch_delay_seconds: 0.0

# Поведение при обнаружении страницы с совпадающим заголовком под другим родителем:
# 'error' — прервать операцию с исключением (по умолчанию);
# 'move' — перенести существующую страницу под ожидаемого родителя, сохранив содержимое.
title_conflict_policy: "error"

target_release_version: "Platform 2.2"

# наименование компонента
name= libnetfilter_queue

# описание проекта, без кавычек
description= userspace library that provides an API to packets that have been queued by the kernel packet filter

# версии компонента, их суффиксов и Platform
# версии компонента связываются с версиями itcs *по порядку*
versions.component= 1.0.5
versions.itcs= -itcs-1.
versions.platform= 2.0-slow, 1.6-slow

# профили для каждой версии компонента
# profiles-<версия_компонента>-<версия_платформы>(-<суффикс>)
# возможные суффиксы: slow, fast
profiles-1.0.5-2.0-slow= hw-linux-armv7-gcc10_2,\
                         hw-linux-armv8-gcc10_2,\
                         hw-linux-x86_64-gcc10_2,\
                         linux-x86_64-gcc10_2-instrumented

profiles-1.0.5-1.6-slow= hw-linux-x86_64-gcc10_2,\
                         hw-linux-armv8-gcc10_2,\
                         hw-linux-armv7-gcc10_2,\
                         linux-x86_64-gcc10_2-instrumented

# профили для Svace анализа
# svace-profiles-<версия_компонента>-<версия_платформы>
# суффиксы fast и slow не используются
svace-profiles-1.0.5-2.0= hw-linux-x86_64-gcc10_2
svace-profiles-1.0.5-1.6= hw-linux-x86_64-gcc10_2

# профили для интеграционных сборок
# integration-profiles-{support/develop}-<версия_компонента>-<суффикс>
# возможные суффиксы: slow, fast
integration-profiles-develop-1.0.5-2.0-slow= hw-linux-armv7-gcc10_2,\
                                             hw-linux-armv8-gcc10_2,\
                                             hw-linux-x86_64-gcc10_2,\
                                             linux-x86_64-gcc10_2-instrumented

integration-profiles-develop-1.0.5-1.6-slow= hw-linux-x86_64-gcc10_2,\
                                             hw-linux-armv8-gcc10_2,\
                                             hw-linux-armv7-gcc10_2,\
                                             linux-x86_64-gcc10_2-instrumented

# параметры VCS Root (ветка задается через UI)
tfs_git_project= PRG_Quant
git_repo_name= contrib_libnetfilter_queue

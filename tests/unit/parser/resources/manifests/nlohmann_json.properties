# наименование компонента
name= nlohmann_json

# описание проекта, без кавычек
description= JSON for Modern C++ parser and generator.

# версии компонента, их суффиксов и Platform
# версии компонента связываются с версиями itcs *по порядку*
versions.component= 3.9.1, 3.12.0, 3.11.2
versions.platform= 2.0-slow, 2.0-fast, 1.6-slow, 1.6-fast

# алиасы (свой для каждой версии Platform)

# профили для каждой версии компонента
# profiles-<версия_компонента>-<версия_платформы>(-<суффикс>)
# возможные суффиксы: slow, fast
profiles-3.12.0-2.0-fast= mobile-windows-x86_64.jinja

profiles-3.9.1-2.0-slow= hw-linux-x86_64-gcc10_2

profiles-3.12.0-1.6-fast= mobile-windows-x86_64.jinja

profiles-3.11.2-1.6-slow= hw-linux-x86_64-gcc10_2

# профили для Svace анализа
# svace-profiles-<версия_компонента>-<версия_платформы>
# суффиксы fast и slow не используются
svace-profiles-3.9.1-2.0= hw-linux-x86_64-gcc10_2
svace-profiles-3.12.0-2.0= hw-linux-x86_64-gcc10_2
svace-profiles-3.11.2-1.6= hw-linux-x86_64-gcc10_2
svace-profiles-3.12.0-1.6= hw-linux-x86_64-gcc10_2

# профили для интеграционных сборок
# integration-profiles-{support/develop}-<версия_компонента>-<суффикс>
# возможные суффиксы: slow, fast
integration-profiles-develop-3.12.0-2.0-fast= mobile-windows-x86_64.jinja

integration-profiles-support-3.9.1-2.0-slow= hw-linux-x86_64-gcc10_2

integration-profiles-develop-3.12.0-1.6-fast= mobile-windows-x86_64.jinja

integration-profiles-support-3.11.2-1.6-slow= hw-linux-x86_64-gcc10_2

# параметры VCS Root (ветка задается через UI)
tfs_git_project= DEP_Components
git_repo_name= contrib_nlohmann_json
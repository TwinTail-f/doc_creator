# наименование компонента
name= patchelf

# описание проекта, без кавычек
description= PatchELF is a simple utility for modifying existing ELF executables and libraries.

# версии компонента, их суффиксов и Platform
# версии компонента связываются с версиями itcs *по порядку*
versions.component= 0.16.1, 0.18.0
versions.platform= 2.0-tech

# профили для каждой версии компонента
# profiles-<версия_компонента>-<версия_платформы>(-<суффикс>)
# возможные суффиксы= slow, fast
profiles-0.18.0-2.0-tech= crypto_alpine_gcc_aarch64.jinja,\
                          crypto_alpine_gcc_armv7.jinja,\
                          crypto_alpine_gcc_x86.jinja,\
                          crypto_alpine_gcc_x86_64.jinja,\
                          crypto_default_gcc_x86_64.jinja,\
                          hw-linux-x86_64-gcc10_2


profiles-0.16.1-2.0-tech= crypto_alpine_gcc_aarch64.jinja,\
                          crypto_alpine_gcc_armv7.jinja,\
                          crypto_alpine_gcc_x86.jinja,\
                          crypto_alpine_gcc_x86_64.jinja,\
                          crypto_default_gcc_x86_64.jinja,\
                          hw-linux-x86_64-gcc10_2

# профили для Svace анализа
# svace-profiles-<версия_компонента>-<версия_платформы>
# суффиксы fast и slow не используются
svace-profiles-0.18.0-2.0= hw-linux-x86_64-gcc10_2
svace-profiles-0.16.1-2.0= hw-linux-x86_64-gcc10_2

# профили для интеграционных сборок
# integration-profiles-{support/develop}-<версия_компонента>-<суффикс>
# возможные суффиксы= slow, fast

integration-profiles-develop-0.18.0-2.0-tech= crypto_alpine_gcc_aarch64.jinja,\
                                              crypto_alpine_gcc_armv7.jinja,\
                                              crypto_alpine_gcc_x86.jinja,\
                                              crypto_alpine_gcc_x86_64.jinja,\
                                              crypto_default_gcc_x86_64.jinja,\
                                              hw-linux-x86_64-gcc10_2

integration-profiles-support-0.16.1-2.0-tech= crypto_alpine_gcc_aarch64.jinja,\
                                              crypto_alpine_gcc_armv7.jinja,\
                                              crypto_alpine_gcc_x86.jinja,\
                                              crypto_alpine_gcc_x86_64.jinja,\
                                              crypto_default_gcc_x86_64.jinja,\
                                              hw-linux-x86_64-gcc10_2

# параметры VCS Root (ветка задается через UI)
tfs_git_project= DEP_Components
git_repo_name= contrib_patchelf